syntax = "proto3";

import "google/protobuf/timestamp.proto";

package rover;

option java_package = "com.yyrobotics.contracts.proto";
option java_multiple_files = true;

message RoverRouteProgress {

  string routeId = 1;
  int32 currentWaypoint = 2;
  int32 totalWaypoints = 3;
  double remainingDistanceMeters = 4;
  string navigationState = 5;

}