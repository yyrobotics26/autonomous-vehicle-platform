syntax = "proto3";

import "google/protobuf/timestamp.proto";

package rover;

option java_package = "com.yyrobotics.contracts.proto";
option java_multiple_files = true;

message RoverObstacleDetected {

   string obstacleType = 1;
   double obstacleX = 2;
   double obstacleY = 3;
   double distanceMeters = 4;

}